# Site settings for the Intro to Programming notes.
# GitHub Pages builds the site from this file. Restart `jekyll serve`
# after editing it, because Jekyll only reads it at start-up.

title: Intro to Programming
description: p5.js course notes for first-year programming, IADT

# The site lives at https://john-dempsey.github.io/intro-to-programming/
url: "https://john-dempsey.github.io"
baseurl: "/intro-to-programming"

# Just the Docs theme, pinned so a theme update can't change the site unexpectedly.
remote_theme: just-the-docs/just-the-docs@v0.10.1

# GitHub Pages only runs plugins listed here.
# include-cache and seo-tag are needed by the theme;
# redirect-from sends the old home page address to the new one.
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-redirect-from

search_enabled: true

# Link in the top bar to the repo, where students can read the
# README and PLAN files that are not part of the site.
aux_links:
  "View on GitHub":
    - "https://github.com/john-dempsey/intro-to-programming"

# Every page uses the theme's layout unless it says otherwise.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Code is highlighted in the browser by highlight.js (see _includes/head_custom.html),
# so switch off Jekyll's own highlighting to stop the two clashing.
kramdown:
  syntax_highlighter_opts:
    disable: true

# Files that are not part of the published site.
# Markdown files in src/ and exercises/ are excluded so GitHub Pages doesn't
# turn them into site pages; the notes link to them on github.com instead.
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
  - .gitattributes
  - src/*.md
  - src/**/*.md
  - exercises/*.md
  - exercises/**/*.md
